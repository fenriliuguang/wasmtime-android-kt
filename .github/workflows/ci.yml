# Required status check name for Rulesets: "CI"
#
# Docs-only change sets (*.md and changelog/**) skip cargo / NDK / AAR.
# The aggregate job still reports success as "CI" (skipped != missing).
#
# GAV in gradle.properties may be 0.x.y or 0.x.y-SNAPSHOT (Central publishing
# limits). Assemble uses that property as-is; do not reject SNAPSHOT.
name: CI

on:
  push:
    branches: [main, release/0.1.0]
  pull_request:
    branches: [main, release/0.1.0]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Wasmtime debug builds OOMs on default GitHub-hosted runners if fully parallel.
  CARGO_BUILD_JOBS: 2
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  detect:
    name: detect (change set)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify change set
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          files=""
          if [ "$EVENT" = "pull_request" ]; then
            files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[] | .filename, (.previous_filename // empty)')"
          else
            if [ -z "${BASE_SHA}" ] || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ]; then
              echo "heavy=true" >> "$GITHUB_OUTPUT"
              echo "no usable base SHA; running heavy jobs"
              exit 0
            fi
            if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "${BASE_SHA}"
            fi
            files="$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")"
            if [ -z "$files" ]; then
              echo "heavy=true" >> "$GITHUB_OUTPUT"
              echo "empty diff; running heavy jobs"
              exit 0
            fi
          fi
          if [ -z "$files" ]; then
            echo "heavy=true" >> "$GITHUB_OUTPUT"
            echo "empty file list; running heavy jobs"
            exit 0
          fi
          echo "Changed files:"
          printf '%s\n' "$files"
          heavy=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [[ "$f" == *.md ]] || [[ "$f" == changelog/* ]]; then
              continue
            fi
            echo "heavy file: $f"
            heavy=true
            break
          done <<< "$files"
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
          echo "heavy=$heavy"

  native:
    name: native (cargo test)
    if: needs.detect.outputs.heavy == 'true'
    needs: [detect]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config

      # jni crate / future bindgen paths; also mirrors desktop shell expectations.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target
          # Include job parallelism in key so cache stays coherent with RUSTFLAGS.
          shared-key: "native-j2-nodebug"

      - name: cargo test (integration smokes)
        working-directory: native
        run: |
          rustc -V
          cargo --version
          echo "JAVA_HOME=$JAVA_HOME"
          # All native/tests/*.rs. Do NOT enumerate --test names here: parallel short PRs
          # would conflict on this line. Do NOT use --all-targets (OOM on hosted runners).
          # --locked pins CI to Cargo.lock.
          cargo test --locked --tests

  jvm-api:
    name: jvm (runtime-api compile)
    if: needs.detect.outputs.heavy == 'true'
    needs: [detect]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Android AAR / smoke-app need NDK .so — see android-native / android-aar.
      - name: Compile JVM modules
        run: |
          chmod +x gradlew
          ./gradlew :runtime-api:compileKotlin :runtime-jni:compileKotlin --no-daemon

  android-native:
    name: android (ndk .so)
    if: needs.detect.outputs.heavy == 'true'
    needs: [detect]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Android natives
        uses: ./.github/actions/build-android-natives

      - name: Upload jniLibs
        uses: actions/upload-artifact@v4
        with:
          name: android-jniLibs
          path: android/jniLibs
          if-no-files-found: error
          retention-days: 14

  android-aar:
    name: android (AAR + smoke APK)
    if: needs.detect.outputs.heavy == 'true'
    needs: [detect, android-native]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download jniLibs
        uses: actions/download-artifact@v4
        with:
          name: android-jniLibs
          path: android/jniLibs

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble published AARs and smoke APK
        run: |
          chmod +x gradlew
          test -f android/jniLibs/arm64-v8a/libwasmtime_android_kt.so
          test -f android/jniLibs/x86_64/libwasmtime_android_kt.so
          VERSION="$(grep -E '^wasmtime\.android\.version=' gradle.properties | cut -d= -f2-)"
          echo "Assembling GAV ${VERSION} (SNAPSHOT is allowed)"
          ./gradlew \
            :android:assembleRelease \
            :host-dawn:assembleRelease \
            :android-webgpu:assembleRelease \
            :smoke-app:assembleDebug \
            --no-daemon

      - name: Upload AAR and APK
        uses: actions/upload-artifact@v4
        with:
          name: android-maven-artifacts
          path: |
            android/build/outputs/aar/*.aar
            host-dawn/build/outputs/aar/*.aar
            android-webgpu/build/outputs/aar/*.aar
            smoke-app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  # Single required check name for Rulesets: "CI"
  ci:
    name: CI
    needs: [detect, native, jvm-api, android-native, android-aar]
    runs-on: ubuntu-latest
    if: ${{ always() && !cancelled() }}
    steps:
      - name: All required jobs green
        run: |
          set -euo pipefail
          if [ "${{ needs.detect.result }}" != "success" ]; then
            echo "detect=${{ needs.detect.result }}"
            exit 1
          fi
          if [ "${{ needs.detect.outputs.heavy }}" != "true" ]; then
            echo "docs-only (*.md / changelog/**); skipped native, jvm, ndk, aar"
            exit 0
          fi
          if [ "${{ needs.native.result }}" != "success" ] \
            || [ "${{ needs.jvm-api.result }}" != "success" ] \
            || [ "${{ needs.android-native.result }}" != "success" ] \
            || [ "${{ needs.android-aar.result }}" != "success" ]; then
            echo "native=${{ needs.native.result }} jvm-api=${{ needs.jvm-api.result }} android-native=${{ needs.android-native.result }} android-aar=${{ needs.android-aar.result }}"
            exit 1
          fi
