# Required status check name for Rulesets: "CI"
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Wasmtime debug builds OOMs on default GitHub-hosted runners if fully parallel.
  CARGO_BUILD_JOBS: 2
  RUSTFLAGS: "-C debuginfo=0"

jobs:
  native:
    name: native (cargo test)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config

      # jni crate / future bindgen paths; also mirrors desktop shell expectations.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target
          # Include job parallelism in key so cache stays coherent with RUSTFLAGS.
          shared-key: "native-j2-nodebug"

      - name: cargo test (integration smokes)
        working-directory: native
        run: |
          rustc -V
          cargo --version
          echo "JAVA_HOME=$JAVA_HOME"
          # All native/tests/*.rs. Do NOT enumerate --test names here: parallel short PRs
          # would conflict on this line. Do NOT use --all-targets (OOM on hosted runners).
          # --locked pins CI to Cargo.lock.
          cargo test --locked --tests

  jvm-api:
    name: jvm (runtime-api compile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # runtime-jni / android / smoke-app need unpublished GPU host (mavenLocal) or Android SDK — not in this job.
      - name: Compile runtime-api
        run: chmod +x gradlew && ./gradlew :runtime-api:compileKotlin --no-daemon

  # Single required check name for Rulesets: "CI"
  ci:
    name: CI
    needs: [native, jvm-api]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: All required jobs green
        run: |
          if [ "${{ needs.native.result }}" != "success" ] || [ "${{ needs.jvm-api.result }}" != "success" ]; then
            echo "native=${{ needs.native.result }} jvm-api=${{ needs.jvm-api.result }}"
            exit 1
          fi
