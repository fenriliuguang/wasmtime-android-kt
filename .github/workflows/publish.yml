# Upload to GitHub Packages and/or Maven Central (same GAV).
# Required check name stays "CI" in ci.yml — this workflow is not a Ruleset gate.
#
# Never run from release/0.1.0. Never auto-publish on push to a branch.
# Press: annotated tag v0.x.y on main, or workflow_dispatch from main, both
# gated by GitHub Environment "release" (device instruments + examples cube).
# Never publish :smoke-app.
name: Publish

on:
  workflow_dispatch:
    inputs:
      destination:
        description: Where to upload
        type: choice
        options:
          - github-packages
          - maven-central
          - both
        default: github-packages
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tag to be on origin/main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "refusing: tag ${GITHUB_REF_NAME} is not an ancestor of origin/main"
            exit 1
          fi

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build Android natives
        uses: ./.github/actions/build-android-natives

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          SO="android/jniLibs/arm64-v8a/libwasmtime_android_kt.so"
          if [ ! -f "$SO" ]; then
            echo "missing $SO after cargo-ndk (cannot press)"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEST="${{ inputs.destination }}"
          else
            DEST="both"
          fi

          publish_github=0
          publish_central=0
          case "$DEST" in
            github-packages) publish_github=1 ;;
            maven-central) publish_central=1 ;;
            both) publish_github=1; publish_central=1 ;;
            *) echo "unknown destination: $DEST"; exit 1 ;;
          esac

          if [ "$publish_github" -eq 1 ]; then
            export ORG_GRADLE_PROJECT_githubPackagesUsername="${GITHUB_ACTOR}"
            export ORG_GRADLE_PROJECT_githubPackagesPassword="${GITHUB_TOKEN}"
            ./gradlew publishAllPublicationsToGithubPackagesRepository --no-configuration-cache
          fi

          if [ "$publish_central" -eq 1 ]; then
            if [ -z "${MAVEN_CENTRAL_USERNAME:-}" ] || [ -z "${MAVEN_CENTRAL_PASSWORD:-}" ] || [ -z "${SIGNING_IN_MEMORY_KEY:-}" ]; then
              echo "Maven Central secrets missing (MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD / SIGNING_IN_MEMORY_KEY)"
              exit 1
            fi
            export ORG_GRADLE_PROJECT_mavenCentralUsername="${MAVEN_CENTRAL_USERNAME}"
            export ORG_GRADLE_PROJECT_mavenCentralPassword="${MAVEN_CENTRAL_PASSWORD}"
            export ORG_GRADLE_PROJECT_signingInMemoryKey="${SIGNING_IN_MEMORY_KEY}"
            export ORG_GRADLE_PROJECT_signingInMemoryKeyPassword="${SIGNING_IN_MEMORY_KEY_PASSWORD:-}"
            ./gradlew publishToMavenCentral -PmavenCentralPublishing=true -PsignAllPublications=true --no-configuration-cache
          fi
