# Wasmtime-only: patch/minor PRs. Major needs a short RFC (this file ignores semver-major).
# Pin: docs/scheme/tech-stack.md and native/Cargo.toml.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /native
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
    allow:
      - dependency-name: wasmtime
    ignore:
      - dependency-name: wasmtime
        update-types:
          - version-update:semver-major
