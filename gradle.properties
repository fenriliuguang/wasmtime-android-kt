org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true

# Product coordinate 0.1.1. Later bumps: docs/scheme/api-stability.md.
# Press packs arm64 libwasmtime_android_kt.so + libwebgpu_dawn.so.
# Do not press Central/Packages from CI unless secrets + both arm64
# .so files are present (see .github/workflows/publish.yml).
wasmtime.android.group=io.github.fenriliuguang.wasmtime.android
wasmtime.android.version=0.1.1

# Keep APKs after connectedAndroidTest (OEM / UTP uninstall races).
android.injected.androidTest.leaveApksInstalledAfterRun=true
