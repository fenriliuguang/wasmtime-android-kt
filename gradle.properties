org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true

# L5 / P010-PUB coordinates. Do not press Central/Packages from CI unless
# secrets + arm64 jniLibs are present (see .github/workflows/publish.yml).
wasmtime.android.group=io.github.fenriliuguang.wasmtime.android
wasmtime.android.version=0.2.0

# Keep APKs after connectedAndroidTest (OEM / UTP uninstall races).
android.injected.androidTest.leaveApksInstalledAfterRun=true
