[versions]
agp = "9.3.1"
kotlin = "2.1.21"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
androidxTestServices = "1.5.0"
appcompat = "1.6.1"
# Track A engineered artifacts (mavenLocal via publishEngineeredToMavenLocal).
wasiWebgpu = "0.1.0-experimental"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-test-services = { group = "androidx.test.services", name = "test-services", version.ref = "androidxTestServices" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
wasi-webgpu-host-api = { group = "io.github.fenriliuguang.wasi.webgpu.experimental", name = "host-api", version.ref = "wasiWebgpu" }
wasi-webgpu-host-webgpu = { group = "io.github.fenriliuguang.wasi.webgpu.experimental", name = "host-webgpu", version.ref = "wasiWebgpu" }
wasi-webgpu-abi-cm = { group = "io.github.fenriliuguang.wasi.webgpu.experimental", name = "abi-cm", version.ref = "wasiWebgpu" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
