[package]
name = "wasmtime-android-kt"
version = "0.1.1"
edition = "2021"
description = "Thin JNI cdylib over upstream Wasmtime for Android"
license = "Apache-2.0"
publish = false

[lib]
name = "wasmtime_android_kt"
crate-type = ["cdylib"]

[dependencies]
# Pin wasmtime 47.x (CM async / WASI 0.3). Revise docs/scheme/tech-stack.md on bump.
jni = "0.21"
pollster = "0.4"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
getrandom = "0.3"
wasmtime = { version = "47.0.4", default-features = false, features = [
    "std",
    "cranelift",
    "runtime",
    "component-model",
    "component-model-async",
    "async",
] }

[profile.release]
lto = false
codegen-units = 16
# scripts/build-native-android.ps1 defaults Windows Android cross to opt-level=2
# (stream.write instrument); set CARGO_PROFILE_RELEASE_OPT_LEVEL=0 if rustc ACCESS_VIOLATION.
